spring.application.name=portfolio-api
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Database: H2 file locally. In production set SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD
# (e.g. a free Neon Postgres) and these defaults are overridden.
spring.datasource.url=jdbc:h2:file:./data/portfolio;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health

# Portfolio settings (override with environment variables on the host)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,https://faiyajjarif.github.io}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:change-me}
app.contact.notify-email=${CONTACT_NOTIFY_EMAIL:faiyaj.jarif01@gmail.com}
app.contact.max-per-hour=5

# Email is optional. To get contact-form emails, set on the host:
#   SPRING_MAIL_HOST=smtp.gmail.com  SPRING_MAIL_PORT=587
#   SPRING_MAIL_USERNAME=you@gmail.com  SPRING_MAIL_PASSWORD=<Gmail app password>
#   SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
# Messages are always saved and visible in the admin panel, with or without email.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
