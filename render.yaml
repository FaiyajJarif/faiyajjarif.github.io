# Render Blueprint for the Spring Boot API (render.com -> New -> Blueprint -> pick this repo).
services:
  - type: web
    name: faiyajjarif-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false            # Render asks you for this on first deploy - pick a strong one
      - key: CORS_ORIGINS
        value: https://faiyajjarif.github.io,http://localhost:5173
      # Recommended: after the first deploy, add SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD
      # in the service's Environment tab (free Postgres, e.g. Neon) so data survives restarts.
